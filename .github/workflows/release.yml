name: Release

# Builds the system-wide .deb (Architecture: all). A tag v<version> must match
# "version" in metadata.json and publishes the package as a release;
# workflow_dispatch only builds (artifact, no release). Cinnamon Spices is
# released separately through the spices repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Check tag matches applet version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version PocketTray@spex/files/PocketTray@spex/metadata.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in metadata.json" >&2
            exit 1
          fi

      - name: Build .deb
        run: |
          packaging/build-deb.sh
          cd dist && sha256sum *.deb > SHA256SUMS && ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      # The APT repository (bespex/apt) rebuilds on a schedule, but GitHub runs scheduled workflows
      # only every few hours: the release asks for a run at once. Needs the secret APT_DISPATCH_TOKEN
      # (fine-grained token for bespex/apt, Actions: read and write); without it the step is skipped
      # and the schedule picks the release up later.
      - name: Update the APT repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No APT_DISPATCH_TOKEN: the APT repository's schedule picks the release up later."
            exit 0
          fi
          gh workflow run publish.yml -R bespex/apt
